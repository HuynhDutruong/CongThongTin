<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giáo Xứ Chánh Tòa Mỹ Tho - Giới Thiệu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+JP:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --gold-light: #FFF9C4;
            --white: #FFFFFF;
            --dark-blue: #0A0E2A;
            --pink: #FF69B4;
            --cyan: #00FFFF;
            --purple: #8A2BE2;
            --white-glow: rgba(255, 255, 255, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--dark-blue), var(--purple));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Merriweather', cursive;
            position: relative;
            perspective: 2000px;
        }
        
        /* Starfield */
        .starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .star {
            position: absolute;
            background-color: var(--white);
            border-radius: 50%;
            animation: starZoom var(--duration, 2s) ease-out forwards;
            opacity: 0;
            filter: blur(var(--blur, 0.5px));
            transform: translateZ(-600px) scale(0);
        }
        
        @keyframes starZoom {
            0% { opacity: 0; transform: translateZ(-600px) scale(0); }
            50% { opacity: var(--opacity, 0.8); }
            100% { opacity: var(--opacity, 0.8); transform: translateZ(0) scale(1); }
        }
        
        /* Sparkles */
        .sparkle {
            position: absolute;
            width: var(--size, 10px);
            height: var(--size, 10px);
            background: radial-gradient(circle, var(--color, var(--gold-light)), transparent 70%);
            border-radius: 50%;
            z-index: 10;
            opacity: 0;
            filter: drop-shadow(0 0 6px var(--color, var(--gold)));
            animation: sparkleBurst 2s ease-out forwards;
            transform: translateZ(var(--z, 0px));
        }
        
        @keyframes sparkleBurst {
            0% { opacity: 0; transform: translate(0, 0) scale(0) translateZ(var(--z, 0px)); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(1.8) translateZ(var(--z, 0px)); }
        }
        
        /* Logo Container */
        .logo-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            width: 100%;
            height: 100%;
        }
        
        .logo-wrapper {
            position: relative;
            width: 40vmin;
            height: 40vmin;
            min-width: 300px;
            min-height: 300px;
            transform-style: preserve-3d;
            animation: logoOscillate 2s ease-in-out infinite 3.5s;
        }
        
        @keyframes logoOscillate {
            0%, 100% { transform: translateZ(0) scale(1); }
            50% { transform: translateZ(20px) scale(1.02); }
        }
        
        .logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: contain;
            opacity: 0;
            transform: translateY(100vh) translateZ(-400px) scale(0.2) rotate(45deg);
            animation: logoArcReveal 3s cubic-bezier(0.25, 1, 0.5, 1) forwards, logoPulse 1.5s ease-in-out 3.5s forwards;
            position: relative;
            z-index: 25;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 1));
            backface-visibility: hidden;
        }
        
        @keyframes logoArcReveal {
            0% { opacity: 0; transform: translateY(100vh) translateZ(-400px) scale(0.2) rotate(45deg); }
            50% { opacity: 1; transform: translateY(0) translateZ(150px) scale(1.3) rotate(0deg); }
            80% { transform: translateY(0) translateZ(50px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) translateZ(0) scale(1) rotate(0deg); }
        }
        
        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 40px rgba(255, 215, 0, 1)); }
            50% { filter: drop-shadow(0 0 60px rgba(255, 215, 0, 1.2)); }
        }
        
        /* Glow Effect */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(-50px);
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, 
                rgba(255, 215, 0, 0.5) 0%, 
                rgba(255, 215, 0, 0.15) 40%, 
                transparent 70%);
            border-radius: 50%;
            z-index: 15;
            opacity: 0;
            animation: glowPulse 3s ease-in-out forwards;
            pointer-events: none;
        }
        
        @keyframes glowPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) translateZ(-50px); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.4) translateZ(-20px); }
            100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.2) translateZ(-30px); }
        }
        
        /* Glow Waves */
        .glow-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(-60px);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, 
                var(--white-glow) 0%, 
                transparent 70%);
            border-radius: 50%;
            z-index: 14;
            opacity: 0;
            animation: waveExpand 2s ease-out forwards;
            pointer-events: none;
        }
        
        @keyframes waveExpand {
            0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.5) translateZ(-60px); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2) translateZ(-60px); }
        }
        
        /* Light Flares */
        .flare {
            position: absolute;
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--white), transparent);
            filter: drop-shadow(0 0 10px var(--white));
            z-index: 12;
            opacity: 0;
            animation: flareSweep 1.5s ease-out forwards;
        }
        
        @keyframes flareSweep {
            0% { opacity: 0; transform: translateX(-100vw) rotate(var(--angle, 0deg)); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateX(100vw) rotate(var(--angle, 0deg)); }
        }
        
        /* Light Bursts */
        .burst-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .burst {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 25px 6px;
            z-index: 5;
            opacity: 0;
            transform: translateZ(50px);
        }
        
        .burst-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            z-index: 6;
            opacity: 0;
            filter: blur(0.5px);
            transform: translateZ(var(--z, 0px));
        }
        
        /* Light Beams */
        .light-beam {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, 
                rgba(255, 255, 255, 0.2) 0%, 
                transparent 70%);
            border-radius: 50%;
            z-index: 3;
            opacity: 0;
            animation: beamFade 2.5s ease-in-out forwards;
            transform: translateZ(-100px);
        }
        
        @keyframes beamFade {
            0% { opacity: 0; transform: scale(0.5) translateZ(-100px); }
            50% { opacity: 0.5; transform: scale(2) translateZ(-50px); }
            100% { opacity: 0; transform: scale(2.5) translateZ(-50px); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .logo-wrapper {
                width: 65vmin;
                height: 65vmin;
                min-width: 220px;
                min-height: 220px;
            }
            
            .glow, .glow-wave {
                width: 150%;
                height: 150%;
            }
            
            .star, .sparkle, .burst-particle {
                transform: translateZ(calc(var(--z, 0px) * 0.5));
            }
            
            .flare {
                width: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Starfield -->
    <div class="starfield" id="starfield"></div>
    
    <!-- Light Beams -->
    <div class="light-beam" style="top: 20%; left: 10%; animation-delay: 0.5s;"></div>
    <div class="light-beam" style="top: 70%; left: 80%; animation-delay: 1.5s;"></div>
    
    <!-- Burst Container -->
    <div class="burst-container" id="bursts"></div>
    
    <!-- Logo -->
    <div class="logo-container">
        <div class="logo-wrapper">
            <div class="glow"></div>
            <div class="glow-wave" style="animation-delay: 2s;"></div>
            <div class="glow-wave" style="animation-delay: 3.5s;"></div>
            <img src="assets/logo.png" alt="Logo Giáo Xứ Chánh Tòa Mỹ Tho" class="logo">
        </div>
    </div>
    
    <!-- Audio -->
    <audio id="bgMusic" src="assets/audio/upbeat_intro_music.mp3" preload="auto"></audio>
    <audio id="burstSound" src="audio/firework.mp3" preload="auto"></audio>
    
    <script>
        // Initialize audio
        const bgMusic = document.getElementById('bgMusic');
        const burstSound = document.getElementById('burstSound');
        bgMusic.volume = 0.7;
        burstSound.volume = 0.3;
        
        // Play music on user interaction
        function startAudio() {
            bgMusic.play().catch(e => console.log("Audio error:", e));
            document.removeEventListener('click', startAudio);
            document.removeEventListener('touchstart', startAudio);
        }
        
        document.addEventListener('click', startAudio);
        document.addEventListener('touchstart', startAudio);
        
        // Create starfield
        const starfield = document.getElementById('starfield');
        const starCount = window.innerWidth <= 768 ? 80 : 250;
        
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = i % 10 === 0 ? Math.random() * 4 + 2 : Math.random() * 2 + 1; // Larger hero stars
            const opacity = Math.random() * 0.6 + 0.4;
            const duration = 1.5 + Math.random() * 2;
            const delay = Math.random() * 2;
            const blur = i % 10 === 0 ? 0.2 : 0.5;
            
            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.setProperty('--opacity', opacity);
            star.style.setProperty('--duration', `${duration}s`);
            star.style.setProperty('--blur', `${blur}px`);
            star.style.animationDelay = `${delay}s`;
            
            starfield.appendChild(star);
        }
        
        // Create sparkles
        function createSparkle(x, y, color, size = 10) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            
            const dx = (Math.random() - 0.5) * 300;
            const dy = (Math.random() - 0.5) * 300;
            const z = (Math.random() - 0.5) * 150;
            
            sparkle.style.left = `${x}px`;
            sparkle.style.top = `${y}px`;
            sparkle.style.setProperty('--dx', `${dx}px`);
            sparkle.style.setProperty('--dy', `${dy}px`);
            sparkle.style.setProperty('--z', `${z}px`);
            sparkle.style.setProperty('--color', color);
            sparkle.style.setProperty('--size', `${size}px`);
            sparkle.style.animationDelay = `${Math.random() * 0.8}s`;
            
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 2000);
        }
        
        // Create light flare
        function createFlare() {
            const flare = document.createElement('div');
            flare.className = 'flare';
            
            const y = Math.random() * window.innerHeight;
            const angle = Math.random() * 30 - 15;
            
            flare.style.top = `${y}px`;
            flare.style.setProperty('--angle', `${angle}deg`);
            flare.style.animationDelay = `${Math.random() * 2}s`;
            
            document.body.appendChild(flare);
            
            setTimeout(() => {
                flare.remove();
            }, 1500);
        }
        
        // Create light burst
        function createBurst(x, y, color) {
            const burst = document.createElement('div');
            burst.className = 'burst';
            burst.style.left = `${x}px`;
            burst.style.top = `${y}px`;
            burst.style.boxShadow = `0 0 25px 6px ${color}`;
            burst.style.backgroundColor = color;
            
            document.getElementById('bursts').appendChild(burst);
            
            const particleCount = window.innerWidth <= 768 ? 20 : 60;
            const angleIncrement = (Math.PI * 2) / particleCount;
            
            setTimeout(() => {
                burstSound.currentTime = 0;
                burstSound.play().catch(e => console.log("Burst sound error:", e));
                
                burst.style.opacity = '0';
                burst.style.transform = 'scale(0) translateZ(50px)';
                burst.style.transition = 'all 0.4s ease-out';
                
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'burst-particle';
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    
                    const hueShift = Math.random() * 30 - 15;
                    const particleColor = `hsl(${getHue(color) + hueShift}, 100%, 70%)`;
                    particle.style.backgroundColor = particleColor;
                    particle.style.boxShadow = `0 0 8px 2px ${particleColor}`;
                    
                    const size = 4 + Math.random() * 3;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    
                    const angle = angleIncrement * i;
                    const velocity = 1.2 + Math.random() * 2.5;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    const vz = (Math.random() - 0.5) * 2;
                    
                    document.getElementById('bursts').appendChild(particle);
                    
                    setTimeout(() => {
                        particle.style.opacity = '1';
                        particle.style.transition = 'all 1.2s ease-out';
                        
                        const distance = 60 + Math.random() * 120;
                        particle.style.transform = `translate(${vx * distance}px, ${vy * distance}px) translateZ(${vz * distance}px)`;
                        particle.style.setProperty('--z', `${vz * distance}px`);
                        particle.style.opacity = '0';
                        
                        setTimeout(() => {
                            particle.remove();
                        }, 1200);
                    }, 0);
                }
                
                // Create sparkles during burst
                for (let i = 0; i < 15; i++) {
                    createSparkle(x, y, color, 8 + Math.random() * 4);
                }
                
                setTimeout(() => {
                    burst.remove();
                }, 400);
            }, 300 + Math.random() * 300);
            
            setTimeout(() => {
                burst.style.opacity = '1';
                burst.style.transform = 'scale(1) translateZ(50px)';
                burst.style.transition = 'all 0.3s ease-out';
            }, 0);
        }
        
        // Get hue from color
        function getHue(color) {
            const temp = document.createElement('div');
            temp.style.color = color;
            document.body.appendChild(temp);
            const rgb = window.getComputedStyle(temp).color;
            document.body.removeChild(temp);
            
            const match = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
            if (!match) return 60;
            
            const r = parseInt(match[1]) / 255;
            const g = parseInt(match[2]) / 255;
            const b = parseInt(match[3]) / 255;
            
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h = 0;
            
            if (max === min) {
                h = 0;
            } else {
                const d = max - min;
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            
            return Math.round(h * 360);
        }
        
        // Launch random bursts
        function launchRandomBurst() {
            const colors = [
                '#FFD700', // Gold
                '#FF69B4', // Pink
                '#00FFFF', // Cyan
                '#FF4500', // OrangeRed
                '#7B68EE', // MediumSlateBlue
                '#32CD32', // LimeGreen
                '#FFFFFF'  // White
            ];
            
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight * 0.5;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            createBurst(x, y, color);
        }
        
        // Initialize sparkles
        for (let i = 0; i < (window.innerWidth <= 768 ? 20 : 40); i++) {
            const x = window.innerWidth / 2 + (Math.random() - 0.5) * 400;
            const y = window.innerHeight / 2 + (Math.random() - 0.5) * 400;
            const colors = ['#FFD700', '#FF69B4', '#00FFFF', '#FFFFFF'];
            createSparkle(x, y, colors[Math.floor(Math.random() * colors.length)], 6 + Math.random() * 6);
        }
        
        // Run effects
        let burstInterval = setInterval(launchRandomBurst, window.innerWidth <= 768 ? 800 : 500);
        let sparkleInterval = setInterval(() => {
            const x = window.innerWidth / 2 + (Math.random() - 0.5) * 400;
            const y = window.innerHeight / 2 + (Math.random() - 0.5) * 400;
            const colors = ['#FFD700', '#FF69B4', '#00FFFF', '#FFFFFF'];
            createSparkle(x, y, colors[Math.floor(Math.random() * colors.length)], 6 + Math.random() * 6);
        }, 200);
        let flareInterval = setInterval(createFlare, 1000);
        
        // Timed bursts for synchronization
        setTimeout(() => createBurst(window.innerWidth / 2, window.innerHeight / 2, '#FFD700'), 2000);
        setTimeout(() => createBurst(window.innerWidth / 2, window.innerHeight / 2, '#FF69B4'), 3500);
        setTimeout(() => createBurst(window.innerWidth / 2, window.innerHeight / 2, '#00FFFF'), 5000);
        
        // Redirect after 7 seconds
        setTimeout(() => {
            clearInterval(burstInterval);
            clearInterval(sparkleInterval);
            clearInterval(flareInterval);
            window.location.href = 'index.html';
        }, 7000);
        
        // Mobile optimization
        function isMobile() {
            return window.innerWidth <= 768;
        }
        
        if (isMobile()) {
            const stars = document.querySelectorAll('.star');
            for (let i = 80; i < stars.length; i++) {
                stars[i].remove();
            }
        }
    </script>
</body>
</html>
